plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = '1.0.0'
group = 'dev.herrastudio.tacticalactions'
base.archivesName = 'tactical-actions-1.21.1-neoforge'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
repositories {
    mavenCentral()
    maven { name = 'RedlanceMinecraft'; url = uri('https://repo.redlance.org/public') }
}
neoForge {
    version = '21.1.251'
    runs { client { client(); gameDirectory = file(providers.gradleProperty('gameDir').orElse('run').get()) } }
    mods { tacticalactions { sourceSet(sourceSets.main) } }
}
dependencies {
    implementation 'com.zigythebird.playeranim:PlayerAnimationLibNeo:1.1.6+mc.1.21.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach { includeEmptyDirs = false; from('LICENSE') }
